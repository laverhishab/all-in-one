<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Web Apps</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#1d1f27;--sub:#6b7280;--pri:#4f46e5;--line:#e5e7eb;--red:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#14151a;--card:#1f2128;--text:#eceef4;--sub:#9aa0ae;--pri:#818cf8;--line:#2e313b;--red:#f87171}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 14px;background:var(--line);color:var(--text)}
button.pri{background:var(--pri);color:#fff}
button.del{color:var(--red)}
main{padding:16px;max-width:900px;margin:auto}
input[type=text],input[type=search],input[type=url]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit;margin-top:6px}
h3{margin:18px 0 8px;font-size:14px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:16px 10px}
.tile{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--text);font-size:12px;gap:6px;text-align:center;-webkit-user-select:none;user-select:none}
.tile span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:60px;height:60px;border-radius:15px;background:var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:700;font-size:26px;flex:none}
.ic img{width:100%;height:100%;object-fit:cover}
.empty{text-align:center;color:var(--sub);padding:60px 20px;line-height:1.8}
.row{display:flex;align-items:center;gap:10px;background:var(--card);padding:10px;border-radius:12px;margin-bottom:8px}
.row .ic{width:42px;height:42px;font-size:18px;border-radius:11px}
.row .meta{flex:1;min-width:0}
.row .meta b,.row .meta small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--sub)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
dialog{border:0;border-radius:16px;padding:18px;width:min(92vw,400px);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:13px;color:var(--sub);margin-top:10px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <h1 id="title">My Web Apps</h1>
  <button id="toggle">⚙ Settings</button>
</header>

<main>
  <section id="home">
    <input type="search" id="q" placeholder="🔍 সার্চ করুন">
    <div id="homeList"></div>
  </section>

  <section id="settings" class="hidden">
    <div class="bar">
      <button class="pri" id="add">＋ URL যুক্ত করুন</button>
      <button id="backup">ব্যাকআপ (কপি)</button>
      <button id="restore">রিস্টোর (পেস্ট)</button>
    </div>
    <div id="setList"></div>
  </section>
</main>

<dialog id="dlg">
  <b id="dlgTitle"></b>
  <label>Website URL<input type="url" id="fUrl" placeholder="facebook.com"></label>
  <label>নাম (ফাঁকা রাখলে অটো)<input type="text" id="fName"></label>
  <label>গ্রুপ (যেমন: সোশ্যাল)<input type="text" id="fGroup"></label>
  <label>আইকনের ছবি
    <div style="display:flex;align-items:center;gap:10px;margin-top:6px">
      <div class="ic" id="fPrev" style="width:44px;height:44px"></div>
      <input type="file" id="fFile" accept="image/*" style="flex:1;min-width:0">
    </div>
  </label>
  <div class="acts">
    <button class="del" id="fDel">Delete</button>
    <button id="fCancel">বাতিল</button>
    <button class="pri" id="fSave">সংরক্ষণ</button>
  </div>
</dialog>

<script>
const KEY = 'my_web_apps_v1';
let sites = [];
try { sites = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(sites)); } catch (e) { alert('সংরক্ষণ করা যায়নি'); } };

const $ = id => document.getElementById(id);
const norm = u => { u = u.trim(); return /^https?:\/\//i.test(u) ? u : 'https://' + u; };
const host = u => { try { return new URL(u).hostname; } catch (e) { return ''; } };
const favUrl = s => s.img || 'https://www.google.com/s2/favicons?domain=' + host(s.url) + '&sz=128';

function icon(s) {
  const d = document.createElement('div');
  d.className = 'ic';
  const letter = () => { d.textContent = (s.name || '?')[0].toUpperCase(); };
  const im = document.createElement('img');
  im.alt = '';
  im.onerror = () => { im.remove(); letter(); };
  im.src = favUrl(s);
  d.appendChild(im);
  return d;
}

function renderHome() {
  const q = $('q').value.toLowerCase();
  const box = $('homeList');
  box.innerHTML = '';
  const list = sites.filter(s => s.name.toLowerCase().includes(q));
  if (!sites.length) {
    box.innerHTML = '<div class="empty">কোনো ওয়েবসাইট নেই।<br>উপরে ⚙ Settings-এ গিয়ে URL যুক্ত করুন।</div>';
    return;
  }
  const groups = {};
  list.forEach(s => (groups[s.group || ''] = groups[s.group || ''] || []).push(s));
  Object.keys(groups).sort((a, b) => a === '' ? -1 : b === '' ? 1 : a.localeCompare(b)).forEach(g => {
    if (g) { const h = document.createElement('h3'); h.textContent = g; box.appendChild(h); }
    const grid = document.createElement('div');
    grid.className = 'grid';
    groups[g].forEach(s => {
      const a = document.createElement('a');
      a.className = 'tile';
      a.href = s.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.appendChild(icon(s));
      const n = document.createElement('span');
      n.textContent = s.name;
      a.appendChild(n);
      let t;
      a.addEventListener('touchstart', () => { t = setTimeout(() => { t = 'long'; openDlg(s); }, 600); }, { passive: true });
      a.addEventListener('touchend', e => { if (t === 'long') e.preventDefault(); clearTimeout(t); });
      a.addEventListener('contextmenu', e => { e.preventDefault(); openDlg(s); });
      grid.appendChild(a);
    });
    box.appendChild(grid);
  });
}

function renderSettings() {
  const box = $('setList');
  box.innerHTML = '';
  if (!sites.length) box.innerHTML = '<div class="empty">এখনও কিছু যুক্ত করা হয়নি</div>';
  sites.forEach((s, i) => {
    const r = document.createElement('div');
    r.className = 'row';
    r.appendChild(icon(s));
    const m = document.createElement('div');
    m.className = 'meta';
    const b = document.createElement('b'); b.textContent = s.name;
    const sm = document.createElement('small'); sm.textContent = (s.group ? s.group + ' • ' : '') + s.url;
    m.append(b, sm);
    r.appendChild(m);
    const mk = (txt, fn, cls) => { const x = document.createElement('button'); x.textContent = txt; if (cls) x.className = cls; x.onclick = fn; r.appendChild(x); };
    mk('▲', () => move(i, -1));
    mk('▼', () => move(i, 1));
    mk('✎', () => openDlg(s));
    mk('🗑', () => { if (confirm('"' + s.name + '" মুছে ফেলবেন?')) { sites.splice(i, 1); save(); renderAll(); } }, 'del');
    box.appendChild(r);
  });
}

function move(i, d) {
  const j = i + d;
  if (j < 0 || j >= sites.length) return;
  [sites[i], sites[j]] = [sites[j], sites[i]];
  save(); renderAll();
}

const renderAll = () => { renderHome(); renderSettings(); };

// ডায়ালগ
let editing = null, img = null;
function showPrev() {
  const p = $('fPrev');
  p.innerHTML = '';
  if (img) { const im = document.createElement('img'); im.src = img; p.appendChild(im); }
  else p.textContent = '🌐';
}
function openDlg(s) {
  editing = s || null;
  img = s ? s.img || null : null;
  $('dlgTitle').textContent = s ? 'এডিট করুন' : 'নতুন ওয়েবসাইট';
  $('fUrl').value = s ? s.url : '';
  $('fName').value = s ? s.name : '';
  $('fGroup').value = s ? s.group || '' : '';
  $('fFile').value = '';
  $('fDel').style.display = s ? '' : 'none';
  showPrev();
  $('dlg').showModal();
}
$('fFile').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const side = Math.min(im.width, im.height);
      c.getContext('2d').drawImage(im, (im.width - side) / 2, (im.height - side) / 2, side, side, 0, 0, 128, 128);
      img = c.toDataURL('image/png');
      showPrev();
    };
    im.src = r.result;
  };
  r.readAsDataURL(f);
};
$('fSave').onclick = () => {
  if (!$('fUrl').value.trim()) return;
  const u = norm($('fUrl').value);
  const h = host(u).replace(/^www\./, '');
  const n = $('fName').value.trim() || h.split('.')[0] || u;
  const g = $('fGroup').value.trim();
  if (editing) Object.assign(editing, { url: u, name: n, group: g, img });
  else sites.push({ id: Date.now() + '', url: u, name: n, group: g, img });
  save(); renderAll(); $('dlg').close();
};
$('fCancel').onclick = () => $('dlg').close();
$('fDel').onclick = () => {
  if (editing && confirm('মুছে ফেলবেন?')) { sites = sites.filter(x => x !== editing); save(); renderAll(); $('dlg').close(); }
};
$('add').onclick = () => openDlg(null);

// ব্যাকআপ / রিস্টোর
$('backup').onclick = async () => {
  const t = JSON.stringify(sites);
  try { await navigator.clipboard.writeText(t); alert('ব্যাকআপ কপি হয়েছে। কোথাও সেভ রাখুন।'); }
  catch (e) { prompt('এই লেখাটা কপি করে রাখুন:', t); }
};
$('restore').onclick = () => {
  const t = prompt('ব্যাকআপের লেখাটা পেস্ট করুন:');
  if (!t) return;
  try {
    const l = JSON.parse(t);
    if (!Array.isArray(l)) throw 0;
    sites = l; save(); renderAll();
    alert(l.length + 'টি সাইট ফিরে এসেছে');
  } catch (e) { alert('সঠিক ব্যাকআপ নয়'); }
};

// ভিউ বদল
let inSet = false;
$('toggle').onclick = () => {
  inSet = !inSet;
  $('home').classList.toggle('hidden', inSet);
  $('settings').classList.toggle('hidden', !inSet);
  $('toggle').textContent = inSet ? '← Home' : '⚙ Settings';
  $('title').textContent = inSet ? 'Settings' : 'My Web Apps';
};
$('q').oninput = renderHome;

renderAll();
</script>
</body>
</html>
