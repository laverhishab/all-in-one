<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Browser</title>
<meta name="theme-color" content="#5b4bf5">
<style>
:root{--bg:#f4f5fb;--card:#fff;--text:#171a26;--sub:#6a7083;--pri:#5b4bf5;--pri2:#8a5cf6;--line:#e7e9f3;--shadow:0 4px 16px rgba(40,40,90,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1016;--card:#1a1c26;--text:#eef0f7;--sub:#9aa1b4;--line:#2a2d3a;--shadow:0 4px 16px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--text);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;cursor:pointer;border:0;color:inherit}
#top{display:flex;align-items:center;gap:6px;padding:8px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
#top button{flex:none;width:38px;height:38px;border-radius:12px;font-size:18px;background:rgba(255,255,255,.2);color:#fff}
#top button:active{transform:scale(.93)}
#addr{flex:1;min-width:0;height:38px;border:0;border-radius:999px;padding:0 16px;font:inherit;font-size:14px;background:#fff;color:#171a26;outline:none}
#strip{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;background:#1f2430;scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:6px;max-width:160px;padding:7px 8px 7px 10px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:13px;cursor:pointer}
.tab img{width:16px;height:16px;border-radius:4px}
.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab b{opacity:.7;padding:0 2px;font-weight:400}
.tab.on{background:#fff;color:#1f2430}
.tab.plus{padding:7px 14px;font-size:16px}
#view{flex:1;position:relative;min-height:0}
#frames,#ntp{position:absolute;inset:0}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.nf{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;line-height:1.7;background:var(--bg)}
.nf img{width:56px;height:56px;border-radius:14px;box-shadow:var(--shadow)}
.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:600;padding:11px 20px;border-radius:14px;box-shadow:0 4px 12px rgba(91,75,245,.35)}
#ntp{overflow-y:auto;padding:28px 16px 40px}
#ntp .wrap{max-width:720px;margin:auto}
#ntp h1{margin:0 0 18px;text-align:center;font-size:22px}
#q{width:100%;height:46px;border:0;border-radius:999px;padding:0 20px;font:inherit;background:var(--card);color:var(--text);box-shadow:var(--shadow);outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:18px 8px;margin-top:26px}
.sc{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 2px;background:none;font-size:12px;font-weight:500;color:var(--text)}
.sc:active{transform:scale(.93)}
.sc .ic{width:62px;height:62px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:26px;font-weight:700}
.sc .ic img{width:100%;height:100%;object-fit:cover}
.sc span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .x{position:absolute;top:0;right:8px;width:22px;height:22px;border-radius:50%;background:#e5484d;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.bar{display:flex;justify-content:center;margin-top:22px}
.bar button{background:var(--card);box-shadow:var(--shadow);padding:9px 16px;border-radius:12px;font-size:13px;font-weight:600}
</style>
</head>
<body>
<div id="top">
  <button id="bHome" title="হোম">🏠</button>
  <input id="addr" type="text" inputmode="url" autocapitalize="off" autocomplete="off" placeholder="সার্চ করুন বা URL লিখুন">
  <button id="bReload" title="রিলোড">⟳</button>
  <button id="bExt" title="বাইরে খুলুন">↗</button>
</div>
<div id="strip"></div>
<div id="view">
  <div id="ntp">
    <div class="wrap">
      <h1>🌐 My Browser</h1>
      <input id="q" type="text" placeholder="🔍 সার্চ বা URL" autocomplete="off">
      <div class="grid" id="grid"></div>
      <div class="bar"><button id="bEdit">✎ সম্পাদনা</button></div>
    </div>
  </div>
  <div id="frames"></div>
</div>

<script>
const KEY = 'my_browser_v1';
const $ = id => document.getElementById(id);
const DEF = [
  { n: 'Wikipedia', u: 'https://wikipedia.org' },
  { n: 'Facebook', u: 'https://facebook.com' },
  { n: 'YouTube', u: 'https://youtube.com' },
  { n: 'GitHub', u: 'https://github.com' }
];
let sc = null;
try { sc = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
if (!Array.isArray(sc)) sc = DEF.slice();
const saveSc = () => { try { localStorage.setItem(KEY, JSON.stringify(sc)); } catch (e) {} };

const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
const fav = u => 'https://www.google.com/s2/favicons?domain=' + host(u) + '&sz=64';
const norm = t => {
  t = t.trim();
  if (!t) return '';
  if (/^https?:\/\//i.test(t)) return t;
  if (!/\s/.test(t) && /\.[a-z]{2,}/i.test(t)) return 'https://' + t;
  return 'https://duckduckgo.com/?q=' + encodeURIComponent(t);
};

// যেসব সাইট iframe-এর ভেতরে খোলার অনুমতি দেয় না
const NOFRAME = ['facebook.com','fb.com','messenger.com','instagram.com','google.com','gmail.com','youtube.com','youtu.be','whatsapp.com','twitter.com','x.com','linkedin.com','github.com','netflix.com','amazon.com','paypal.com','microsoft.com','live.com','outlook.com','bing.com','duckduckgo.com','reddit.com','tiktok.com','telegram.org','pinterest.com','discord.com','spotify.com','apple.com','yahoo.com','zoom.us','dropbox.com'];
const blocked = u => { const h = host(u); return NOFRAME.some(d => h === d || h.endsWith('.' + d)); };
const openExt = u => { window.open(u, '_blank') || (location.href = u); };

// ---------- ট্যাব ----------
let tabs = [], cur = null, uid = 0, edit = false;

function makeEl(u) {
  if (blocked(u)) {
    const d = document.createElement('div');
    d.className = 'nf';
    const im = document.createElement('img'); im.alt = ''; im.src = fav(u); im.onerror = () => im.remove();
    const p = document.createElement('div');
    const b = document.createElement('b'); b.textContent = host(u);
    p.append(b, ' ভেতরে খোলার অনুমতি দেয় না।');
    const btn = document.createElement('button'); btn.className = 'pri'; btn.textContent = 'সাইটটি খুলুন ↗';
    btn.onclick = () => openExt(u);
    d.append(im, p, btn);
    return d;
  }
  const f = document.createElement('iframe');
  f.allow = 'camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen; autoplay';
  f.setAttribute('allowfullscreen', '');
  f.src = u;
  return f;
}

function newTab(url) {
  const t = { id: ++uid, url: null, title: 'নতুন ট্যাব', el: null };
  tabs.push(t);
  cur = t;
  if (url) go(t, url); else render();
  return t;
}
function go(t, u) {
  t.url = u;
  t.title = host(u) || u;
  if (t.el) t.el.remove();
  t.el = makeEl(u);
  $('frames').appendChild(t.el);
  render();
}
function goHome(t) {
  if (t.el) t.el.remove();
  t.el = null; t.url = null; t.title = 'নতুন ট্যাব';
  render();
}
function select(t) { cur = t; render(); }
function closeTab(t) {
  const i = tabs.indexOf(t);
  if (t.el) t.el.remove();
  tabs.splice(i, 1);
  if (!tabs.length) { newTab(); return; }
  if (cur === t) cur = tabs[Math.max(0, i - 1)];
  render();
}

function render() {
  // ট্যাব বার
  const s = $('strip'); s.innerHTML = '';
  tabs.forEach(t => {
    const c = document.createElement('div');
    c.className = 'tab' + (t === cur ? ' on' : '');
    if (t.url) { const im = document.createElement('img'); im.alt = ''; im.src = fav(t.url); im.onerror = () => im.remove(); c.appendChild(im); }
    const n = document.createElement('span'); n.textContent = t.title;
    const x = document.createElement('b'); x.textContent = '✕';
    x.onclick = e => { e.stopPropagation(); closeTab(t); };
    c.append(n, x);
    c.onclick = () => select(t);
    s.appendChild(c);
  });
  const p = document.createElement('div'); p.className = 'tab plus'; p.textContent = '＋'; p.onclick = () => newTab();
  s.appendChild(p);
  const on = s.querySelector('.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });

  // কনটেন্ট
  tabs.forEach(t => { if (t.el) t.el.style.display = t === cur ? '' : 'none'; });
  $('ntp').style.display = cur && cur.url ? 'none' : '';
  $('addr').value = cur && cur.url ? cur.url : '';
  if (!cur.url) renderGrid();
}

// ---------- হোম পেজের শর্টকাট ----------
function renderGrid() {
  const g = $('grid'); g.innerHTML = '';
  sc.forEach((s, i) => {
    const b = document.createElement('button'); b.className = 'sc';
    const ic = document.createElement('div'); ic.className = 'ic';
    const im = document.createElement('img'); im.alt = ''; im.src = fav(s.u);
    im.onerror = () => { im.remove(); ic.textContent = (s.n || '?')[0].toUpperCase(); };
    ic.appendChild(im);
    const n = document.createElement('span'); n.textContent = s.n;
    b.append(ic, n);
    if (edit) {
      const x = document.createElement('div'); x.className = 'x'; x.textContent = '✕';
      b.appendChild(x);
      b.onclick = () => { if (confirm('"' + s.n + '" মুছে ফেলবেন?')) { sc.splice(i, 1); saveSc(); renderGrid(); } };
    } else {
      b.onclick = () => go(cur, s.u);
    }
    g.appendChild(b);
  });
  const a = document.createElement('button'); a.className = 'sc';
  const ai = document.createElement('div'); ai.className = 'ic'; ai.textContent = '＋';
  const an = document.createElement('span'); an.textContent = 'যুক্ত করুন';
  a.append(ai, an);
  a.onclick = () => {
    const t = prompt('ওয়েবসাইটের URL (যেমন: wikipedia.org):');
    if (!t || !t.trim()) return;
    const u = /^https?:\/\//i.test(t.trim()) ? t.trim() : 'https://' + t.trim();
    const n = (prompt('নাম:', host(u).split('.')[0]) || host(u)).trim();
    sc.push({ n, u }); saveSc(); renderGrid();
  };
  g.appendChild(a);
  $('bEdit').textContent = edit ? '✓ শেষ' : '✎ সম্পাদনা';
}

// ---------- বাটন ও ইনপুট ----------
function submit(v) { const u = norm(v); if (u) go(cur, u); }
$('addr').addEventListener('keydown', e => { if (e.key === 'Enter') { e.target.blur(); submit(e.target.value); } });
$('addr').addEventListener('focus', e => e.target.select());
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.target.blur(); submit(e.target.value); e.target.value = ''; } });
$('bHome').onclick = () => goHome(cur);
$('bReload').onclick = () => {
  if (!cur || !cur.url) return;
  const u = cur.url;
  go(cur, u);
};
$('bExt').onclick = () => { if (cur && cur.url) openExt(cur.url); };
$('bEdit').onclick = () => { edit = !edit; renderGrid(); };

newTab();
</script>
</body>
</html>
